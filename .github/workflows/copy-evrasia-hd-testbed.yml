name: One-time Evrasia HD testbed copy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/copy-evrasia-hd-testbed.yml"

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.REPO_FACTORY_TOKEN }}
      SOURCE_REPO: lvlaksim1/evrasia-hd
      TARGET_REPO: lvlaksim1/evrasia-hd-testbed
    steps:
      - name: Copy repository snapshot safely
        shell: bash
        run: |
          set -euo pipefail
          WORK_DIR="$(mktemp -d)"
          trap 'rm -rf "$WORK_DIR"' EXIT

          gh auth setup-git >/dev/null

          # Prevent copied workflows from executing in the testbed.
          gh api --method PUT "repos/$TARGET_REPO/actions/permissions" -F enabled=false >/dev/null

          # Testbed must not inherit production messaging credentials.
          gh secret delete TELEGRAM_BOT_TOKEN --repo "$TARGET_REPO" >/dev/null 2>&1 || true
          gh secret delete TELEGRAM_CHAT_ID --repo "$TARGET_REPO" >/dev/null 2>&1 || true

          gh repo clone "$SOURCE_REPO" "$WORK_DIR/source" -- --depth=1 >/dev/null
          gh repo clone "$TARGET_REPO" "$WORK_DIR/target" -- --depth=1 >/dev/null

          SOURCE_HEAD="$(git -C "$WORK_DIR/source" rev-parse HEAD)"

          rsync -a --delete --exclude='.git/' "$WORK_DIR/source/" "$WORK_DIR/target/"

          git -C "$WORK_DIR/target" config user.name "repo-factory"
          git -C "$WORK_DIR/target" config user.email "repo-factory@users.noreply.github.com"
          git -C "$WORK_DIR/target" add -A
          git -C "$WORK_DIR/target" commit -m "Copy evrasia-hd snapshot $SOURCE_HEAD"
          git -C "$WORK_DIR/target" push origin HEAD:main

          echo "Copied $SOURCE_REPO@$SOURCE_HEAD to $TARGET_REPO"
