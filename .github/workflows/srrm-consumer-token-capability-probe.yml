name: SRRM Consumer Token Capability Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/srrm-consumer-token-capability-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test owner-token reaction reset capability
        env:
          TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
          TARGET_REPO: "lvlaksim1/ai-agent-lab"
          PR_NUMBER: "1"
          REACTION_ID: "539556814"
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$TOKEN" ]]; then
            echo "TOKEN_PRESENT=0"
            exit 0
          fi
          echo "TOKEN_PRESENT=1"

          auth=(-H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          code="$(curl -sS -D /tmp/h1 -o /tmp/u -w '%{http_code}' "${auth[@]}" https://api.github.com/user)"
          echo "USER_HTTP=$code"
          if [[ "$code" == "200" ]]; then
            echo "USER_LOGIN=$(jq -r '.login // empty' /tmp/u)"
          else
            echo "USER_MESSAGE=$(jq -r '.message // empty' /tmp/u)"
          fi

          sleep 5

          url="https://api.github.com/repos/$TARGET_REPO/issues/$PR_NUMBER/reactions?per_page=100"
          code="$(curl -sS -o /tmp/r1 -w '%{http_code}' "${auth[@]}" "$url")"
          echo "LIST_BEFORE_HTTP=$code"
          if [[ "$code" == "200" ]]; then
            present="$(jq --argjson id "$REACTION_ID" 'any(.[]; .id == $id)' /tmp/r1)"
            echo "PRESENT_BEFORE=$present"
          else
            echo "LIST_BEFORE_MESSAGE=$(jq -r '.message // empty' /tmp/r1)"
          fi

          sleep 5

          del="https://api.github.com/repos/$TARGET_REPO/issues/$PR_NUMBER/reactions/$REACTION_ID"
          code="$(curl -sS -o /tmp/del -w '%{http_code}' "${auth[@]}" -X DELETE "$del")"
          echo "DELETE_HTTP=$code"
          if [[ "$code" != "204" ]]; then
            echo "DELETE_MESSAGE=$(jq -r '.message // empty' /tmp/del 2>/dev/null || true)"
          fi

          sleep 5

          code="$(curl -sS -o /tmp/r2 -w '%{http_code}' "${auth[@]}" "$url")"
          echo "LIST_AFTER_HTTP=$code"
          if [[ "$code" == "200" ]]; then
            present="$(jq --argjson id "$REACTION_ID" 'any(.[]; .id == $id)' /tmp/r2)"
            echo "PRESENT_AFTER=$present"
          else
            echo "LIST_AFTER_MESSAGE=$(jq -r '.message // empty' /tmp/r2)"
          fi
