name: SRRM Consumer Token Capability Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/srrm-consumer-token-capability-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Recheck CONSUMER_DISPATCH_TOKEN capabilities
        env:
          TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
          REPO: "lvlaksim1/ai-agent-lab"
          RUN_ID: "36790770227"
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TOKEN" ]]; then
            echo "TOKEN_PRESENT=0"
            exit 0
          fi
          echo "TOKEN_PRESENT=1"

          call() {
            name="$1"; shift
            code="$(curl -sS -o /tmp/body -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@")"
            echo "${name}_HTTP=$code"
            msg="$(jq -r '.message // empty' /tmp/body 2>/dev/null || true)"
            if [[ -n "$msg" ]]; then echo "${name}_MESSAGE=$msg"; fi
          }

          call RERUN \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{"action":"created","reaction":{"content":"eyes"}}' \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"

          call DISPATCH \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{"event_type":"srrm_reaction","client_payload":{"opcode":"eyes","source":"consumer-token-probe"}}' \
            "https://api.github.com/repos/$REPO/dispatches"

          call CHECKS \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{"action":"created","reaction":{"content":"eyes"}}' \
            "https://api.github.com/repos/$REPO/check-suites/99647359827/rerequest"
