name: SRRM Consumer Token Capability Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/srrm-consumer-token-capability-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Recheck CONSUMER_DISPATCH_TOKEN capabilities
        env:
          TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
          REPO: "lvlaksim1/ai-agent-lab"
          RUN_ID: "36790770227"
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TOKEN" ]]; then
            echo "TOKEN_PRESENT=0"
            exit 0
          fi
          echo "TOKEN_PRESENT=1"

          call() {
            name="$1"; shift
            code="$(curl -sS -o /tmp/body -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@")"
            echo "${name}_HTTP=$code"
            msg="$(jq -r '.message // empty' /tmp/body 2>/dev/null || true)"
            if [[ -n "$msg" ]]; then echo "${name}_MESSAGE=$msg"; fi
          }

          raw='{"action":"created","reaction":{"content":"eyes"},"repository":{"full_name":"lvlaksim1/ai-agent-lab"},"sender":{"login":"lvlaksim1"}}'

          call DISPATCH_WEBHOOK_HEADERS \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: reaction" \
            -H "X-GitHub-Delivery: 11111111-2222-3333-4444-555555555555" \
            -H "X-GitHub-Hook-ID: 123456789" \
            -H "User-Agent: GitHub-Hookshot/test" \
            -X POST \
            -d "$raw" \
            "https://api.github.com/repos/$REPO/dispatches"

          call PAGES_BUILD \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$raw" \
            "https://api.github.com/repos/$REPO/pages/builds"

          call REVIEW_INVALID \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$raw" \
            "https://api.github.com/repos/$REPO/pulls/999999/reviews"
