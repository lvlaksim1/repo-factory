name: Sync Apps Script Secrets

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  sync-apps-script-secrets:
    if: github.event.issue.user.login == 'lvlaksim1' && github.event.issue.title == '[SYNC_APPS_SCRIPT_SECRETS]'
    runs-on: ubuntu-latest

    steps:
      - name: Validate request and sync Apps Script OAuth
        id: sync
        env:
          GH_TOKEN: ${{ secrets.REPO_FACTORY_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          CLASPRC_B64: ${{ secrets.CLASPRC_B64 }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "status=factory_token_missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s' "$ISSUE_BODY" > request.json
          if ! jq -e . request.json >/dev/null 2>&1; then
            echo "status=invalid" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NAME="$(jq -r '.name // empty' request.json)"
          if [[ ! "$NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "status=invalid" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TARGET_REPO="lvlaksim1/$NAME"
          if ! gh api "repos/$TARGET_REPO" >/dev/null 2>&1; then
            echo "status=target_unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${CLASPRC_B64:-}" ]; then
            gh secret set CLASPRC_B64 --repo "$TARGET_REPO" --body "$CLASPRC_B64"
            echo "status=synced_b64" >> "$GITHUB_OUTPUT"
            echo "target_repo=$TARGET_REPO" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${CLASPRC_JSON:-}" ]; then
            gh secret set CLASPRC_JSON --repo "$TARGET_REPO" --body "$CLASPRC_JSON"
            echo "status=synced_json" >> "$GITHUB_OUTPUT"
            echo "target_repo=$TARGET_REPO" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "status=source_missing" >> "$GITHUB_OUTPUT"
          echo "target_repo=$TARGET_REPO" >> "$GITHUB_OUTPUT"

      - name: Report result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STATUS: ${{ steps.sync.outputs.status }}
          TARGET_REPO: ${{ steps.sync.outputs.target_repo }}
        shell: bash
        run: |
          set -euo pipefail

          case "$STATUS" in
            synced_b64)
              BODY="SYNCED: $TARGET_REPO"$'\n'"SECRET: CLASPRC_B64"
              ;;
            synced_json)
              BODY="SYNCED: $TARGET_REPO"$'\n'"SECRET: CLASPRC_JSON"
              ;;
            source_missing)
              BODY="SOURCE_MISSING: repo-factory has neither CLASPRC_B64 nor CLASPRC_JSON."
              ;;
            target_unavailable)
              BODY="FAILED: target repository is unavailable to REPO_FACTORY_TOKEN."
              ;;
            factory_token_missing)
              BODY="FAILED: REPO_FACTORY_TOKEN is not configured."
              ;;
            *)
              BODY="FAILED: invalid request."
              ;;
          esac

          gh api --method POST             "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments"             -f body="$BODY"
