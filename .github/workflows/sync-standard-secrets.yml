name: Sync Standard Secrets

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  sync-standard-secrets:
    if: github.event.issue.user.login == 'lvlaksim1' && github.event.issue.title == '[SYNC_STANDARD_SECRETS]'
    runs-on: ubuntu-latest

    steps:
      - name: Validate request and sync secrets
        id: sync
        env:
          GH_TOKEN: ${{ secrets.REPO_FACTORY_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "status=secret_missing" >> "$GITHUB_OUTPUT"
            echo "message=REPO_FACTORY_TOKEN is not configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "status=source_missing" >> "$GITHUB_OUTPUT"
            echo "message=TELEGRAM_BOT_TOKEN and/or TELEGRAM_CHAT_ID are not configured in repo-factory" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s' "$ISSUE_BODY" > request.json

          if ! jq -e . request.json >/dev/null 2>&1; then
            echo "status=invalid" >> "$GITHUB_OUTPUT"
            echo "message=Issue body must contain valid JSON" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NAME="$(jq -r '.name // empty' request.json)"

          if [[ ! "$NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "status=invalid" >> "$GITHUB_OUTPUT"
            echo "message=Invalid repository name" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TARGET_REPO="lvlaksim1/$NAME"

          if ! gh api "repos/$TARGET_REPO" >/dev/null 2>&1; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "message=Target repository is unavailable to REPO_FACTORY_TOKEN" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! gh secret set TELEGRAM_BOT_TOKEN --repo "$TARGET_REPO" --body "$TELEGRAM_BOT_TOKEN"; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "message=Failed to set TELEGRAM_BOT_TOKEN" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! gh secret set TELEGRAM_CHAT_ID --repo "$TARGET_REPO" --body "$TELEGRAM_CHAT_ID"; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "message=Failed to set TELEGRAM_CHAT_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "status=synced" >> "$GITHUB_OUTPUT"
          echo "target_repo=$TARGET_REPO" >> "$GITHUB_OUTPUT"

      - name: Report result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STATUS: ${{ steps.sync.outputs.status }}
          MESSAGE: ${{ steps.sync.outputs.message }}
          TARGET_REPO: ${{ steps.sync.outputs.target_repo }}
        shell: bash
        run: |
          set -euo pipefail

          case "$STATUS" in
            synced)
              BODY="SYNCED: $TARGET_REPO"$'\n'"SECRETS: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID"
              ;;
            *)
              BODY="FAILED: $MESSAGE"
              ;;
          esac

          gh api             --method POST             "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments"             -f body="$BODY"
