name: Import Network Recorder v1.6.0

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  import:
    if: github.event.issue.user.login == 'lvlaksim1' && github.event.issue.title == '[IMPORT_NETWORK_RECORDER_V160]'
    runs-on: ubuntu-latest

    steps:
      - name: Validate request and import verified baseline
        id: import
        env:
          FACTORY_TOKEN: ${{ secrets.REPO_FACTORY_TOKEN }}
          GH_TOKEN: ${{ secrets.REPO_FACTORY_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          TARGET_REPO: lvlaksim1/network-recorder
          EXPECTED_SHA256: eeb0cdfdf6323c96c6aea777ad9aed889522dc9de13e467b8f447723612e1db3
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${FACTORY_TOKEN:-}" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "message=REPO_FACTORY_TOKEN is not configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s' "$ISSUE_BODY" > request.json
          if ! jq -e . request.json >/dev/null 2>&1; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "message=Issue body must contain valid JSON" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BLOB_SHA="$(jq -r '.blob_sha // empty' request.json)"
          REQUEST_SHA="$(jq -r '.sha256 // empty' request.json)"

          if [[ ! "$BLOB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "message=Invalid blob_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$REQUEST_SHA" != "$EXPECTED_SHA256" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "message=Unexpected source SHA-256" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          WORK_DIR="$(mktemp -d)"
          trap 'rm -rf "$WORK_DIR"' EXIT

          GH_TOKEN="$FACTORY_TOKEN" gh api "repos/lvlaksim1/repo-factory/git/blobs/$BLOB_SHA" --jq '.content' \
            | tr -d '\n' | base64 --decode > "$WORK_DIR/source.zip"

          ACTUAL_SHA="$(sha256sum "$WORK_DIR/source.zip" | awk '{print $1}')"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA256" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "message=Source SHA-256 mismatch: $ACTUAL_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - "$WORK_DIR/source.zip" "$WORK_DIR/extracted" <<'PY'
          import os, re, sys, zipfile, pathlib, shutil

          archive = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])
          out.mkdir(parents=True, exist_ok=True)

          expected = {"manifest.json", "background.js", "content.js", "offscreen.js", "offscreen.html"}
          forbidden_names = {"rsa_private_key.txt"}
          forbidden_suffixes = {".pem", ".key", ".pfx", ".p12"}
          forbidden_markers = (b"-----BEGIN PRIVATE KEY-----", b"-----BEGIN RSA PRIVATE KEY-----")

          with zipfile.ZipFile(archive) as z:
              files = [i for i in z.infolist() if not i.is_dir()]
              mapped = {}
              for info in files:
                  p = pathlib.PurePosixPath(info.filename)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit(f"unsafe archive path: {info.filename}")
                  base = p.name
                  low = base.lower()
                  if low in forbidden_names or pathlib.PurePosixPath(low).suffix in forbidden_suffixes:
                      raise SystemExit(f"private-key file rejected: {info.filename}")
                  data = z.read(info)
                  if any(marker in data for marker in forbidden_markers):
                      raise SystemExit(f"private-key marker rejected: {info.filename}")
                  if base in expected:
                      if base in mapped:
                          raise SystemExit(f"duplicate expected file: {base}")
                      mapped[base] = data

              if set(mapped) != expected:
                  missing = sorted(expected - set(mapped))
                  extra = sorted(set(mapped) - expected)
                  raise SystemExit(f"baseline file set mismatch; missing={missing} extra={extra}")

              for name, data in mapped.items():
                  (out / name).write_bytes(data)
          PY

          GH_TOKEN="$FACTORY_TOKEN" gh auth setup-git >/dev/null
          GH_TOKEN="$FACTORY_TOKEN" gh repo clone "$TARGET_REPO" "$WORK_DIR/target" -- --depth=1 >/dev/null

          rm -rf "$WORK_DIR/target/src"
          mkdir -p "$WORK_DIR/target/src"
          cp "$WORK_DIR/extracted/"* "$WORK_DIR/target/src/"

          cat > "$WORK_DIR/target/docs/BASELINE_V1.6.0.md" <<'EOF'
          # Network Recorder v1.6.0 baseline

          This repository baseline was imported byte-for-byte from the owner-retained stable archive.

          - canonical product name: Network Recorder
          - version: 1.6.0
          - source archive SHA-256: `eeb0cdfdf6323c96c6aea777ad9aed889522dc9de13e467b8f447723612e1db3`
          - expected Extension ID: `paolfcaakecapidipfcfbbhgkpcmgcip`
          - imported files: `manifest.json`, `background.js`, `content.js`, `offscreen.js`, `offscreen.html`

          No private signing key is stored in this repository.
          EOF

          git -C "$WORK_DIR/target" config user.name "repo-factory"
          git -C "$WORK_DIR/target" config user.email "repo-factory@users.noreply.github.com"
          git -C "$WORK_DIR/target" add src docs/BASELINE_V1.6.0.md

          if git -C "$WORK_DIR/target" diff --cached --quiet; then
            echo "status=no_change" >> "$GITHUB_OUTPUT"
            echo "commit=$(git -C "$WORK_DIR/target" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git -C "$WORK_DIR/target" commit --quiet -m "Import Network Recorder v1.6.0 baseline"
          git -C "$WORK_DIR/target" push --quiet origin HEAD:main

          echo "status=imported" >> "$GITHUB_OUTPUT"
          echo "commit=$(git -C "$WORK_DIR/target" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STATUS: ${{ steps.import.outputs.status }}
          MESSAGE: ${{ steps.import.outputs.message }}
          COMMIT: ${{ steps.import.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          case "$STATUS" in
            imported)
              BODY="IMPORTED: lvlaksim1/network-recorder"$'\n'"BASELINE: Network Recorder v1.6.0"$'\n'"COMMIT: $COMMIT"
              ;;
            no_change)
              BODY="NO_CHANGE: baseline already matches"$'\n'"COMMIT: $COMMIT"
              ;;
            *)
              BODY="FAILED: ${MESSAGE:-unknown error}"
              ;;
          esac
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="$BODY"
