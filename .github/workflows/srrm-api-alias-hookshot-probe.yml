name: SRRM API Alias Hookshot Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/srrm-api-alias-hookshot-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test GitHub API host aliases with Hookshot UA
        env:
          TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          body='{"event_type":"srrm_alias_probe","client_payload":{"source":"api-alias-hookshot"}}'

          call() {
            name="$1"; url="$2"
            code="$(curl -sS -o /tmp/body -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              -H "User-Agent: GitHub-Hookshot/test" \
              -X POST -d "$body" "$url")"
            echo "${name}_HTTP=$code"
            if [[ -s /tmp/body ]]; then
              echo -n "${name}_BODY="
              tr '\n' ' ' </tmp/body | head -c 500
              echo
            fi
          }

          call API_NORMAL 'https://api.github.com/repos/lvlaksim1/ai-agent-lab/dispatches'
          call API_TRAILING_DOT 'https://api.github.com./repos/lvlaksim1/ai-agent-lab/dispatches'
          call GITHUB_API_V3 'https://github.com/api/v3/repos/lvlaksim1/ai-agent-lab/dispatches'
          call WWW_GITHUB_API_V3 'https://www.github.com/api/v3/repos/lvlaksim1/ai-agent-lab/dispatches'
