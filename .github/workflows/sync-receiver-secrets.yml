name: Sync Receiver Secrets

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  sync-receiver-secrets:
    if: github.event.issue.user.login == 'lvlaksim1' && github.event.issue.title == '[SYNC_RECEIVER_SECRETS]'
    runs-on: ubuntu-latest

    steps:
      - name: Validate request and sync receiver secrets
        id: sync
        env:
          GH_TOKEN: ${{ secrets.REPO_FACTORY_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          CONSUMER_DISPATCH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "message=REPO_FACTORY_TOKEN is not configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${CONSUMER_DISPATCH_TOKEN:-}" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "message=CONSUMER_DISPATCH_TOKEN is not configured in repo-factory" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s' "$ISSUE_BODY" > request.json

          if ! jq -e . request.json >/dev/null 2>&1; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "message=Issue body must contain valid JSON" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NAME="$(jq -r '.name // empty' request.json)"
          if [[ ! "$NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "message=Invalid repository name" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TARGET_REPO="lvlaksim1/$NAME"

          if ! gh api "repos/$TARGET_REPO" >/dev/null 2>&1; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "message=Target repository is unavailable to REPO_FACTORY_TOKEN" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! gh secret set CONSUMER_DISPATCH_TOKEN --repo "$TARGET_REPO" --body "$CONSUMER_DISPATCH_TOKEN"; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "message=Failed to set CONSUMER_DISPATCH_TOKEN" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "status=synced" >> "$GITHUB_OUTPUT"
          echo "target_repo=$TARGET_REPO" >> "$GITHUB_OUTPUT"

      - name: Report result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STATUS: ${{ steps.sync.outputs.status }}
          MESSAGE: ${{ steps.sync.outputs.message }}
          TARGET_REPO: ${{ steps.sync.outputs.target_repo }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$STATUS" = "synced" ]; then
            BODY="SYNCED: $TARGET_REPO"$'\n'"SECRET: CONSUMER_DISPATCH_TOKEN"
          else
            BODY="FAILED: $MESSAGE"
          fi

          gh api             --method POST             "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments"             -f body="$BODY"
