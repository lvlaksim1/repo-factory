name: SRRM Token Scope Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/srrm-token-scope-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect token metadata without exposing token values
        env:
          FACTORY_TOKEN: ${{ secrets.REPO_FACTORY_TOKEN }}
          CONSUMER_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            label="$1"; token="$2"; url="$3"
            [[ -n "$token" ]] || { echo "$label TOKEN_PRESENT=0"; return; }
            echo "$label TOKEN_PRESENT=1"
            curl -sS -D "/tmp/$label.h" -o "/tmp/$label.b" \
              -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" >/dev/null || true
            code="$(grep -E '^HTTP/' "/tmp/$label.h" | tail -n1 | tr -d '\r' | cut -d' ' -f2)"
            echo "$label HTTP=${code:-unknown}"
            for h in x-oauth-scopes x-accepted-oauth-scopes x-accepted-github-permissions; do
              v="$(grep -i "^$h:" "/tmp/$label.h" | tail -n1 | cut -d: -f2- | sed 's/^[[:space:]]*//' | tr -d '\r' || true)"
              echo "$label ${h^^}=${v:-<empty>}"
            done
          }
          probe FACTORY_USER "$FACTORY_TOKEN" 'https://api.github.com/user'
          probe FACTORY_HOOKS "$FACTORY_TOKEN" 'https://api.github.com/repos/lvlaksim1/repo-factory/hooks'
          probe CONSUMER_USER "$CONSUMER_TOKEN" 'https://api.github.com/user'
          probe CONSUMER_TARGET "$CONSUMER_TOKEN" 'https://api.github.com/repos/lvlaksim1/ai-agent-lab'
          probe CONSUMER_HOOKS "$CONSUMER_TOKEN" 'https://api.github.com/repos/lvlaksim1/ai-agent-lab/hooks'
