name: SRRM Token Scope Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/srrm-token-scope-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect token capabilities without exposing token values
        env:
          FACTORY_TOKEN: ${{ secrets.REPO_FACTORY_TOKEN }}
          CONSUMER_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            label="$1"
            token="$2"
            url="$3"
            if [[ -z "$token" ]]; then
              echo "$label TOKEN_PRESENT=0"
              return
            fi
            echo "$label TOKEN_PRESENT=1"
            curl -sS -D "/tmp/$label.h" -o "/tmp/$label.b" \
              -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" >/dev/null || true
            code="$(awk 'toupper($1) ~ /^HTTP\\// {c=$2} END{print c}' "/tmp/$label.h")"
            scopes="$(awk 'BEGIN{IGNORECASE=1} /^x-oauth-scopes:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub(/\\r/,""); print}' "/tmp/$label.h" | tail -n1)"
            accepted="$(awk 'BEGIN{IGNORECASE=1} /^x-accepted-oauth-scopes:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub(/\\r/,""); print}' "/tmp/$label.h" | tail -n1)"
            echo "$label HTTP=$code"
            echo "$label X_OAUTH_SCOPES=${scopes:-<empty>}"
            echo "$label X_ACCEPTED_OAUTH_SCOPES=${accepted:-<empty>}"
          }

          probe FACTORY_USER "$FACTORY_TOKEN" "https://api.github.com/user"
          probe FACTORY_REPO "$FACTORY_TOKEN" "https://api.github.com/repos/$REPO"
          probe FACTORY_HOOKS "$FACTORY_TOKEN" "https://api.github.com/repos/$REPO/hooks"
          probe CONSUMER_USER "$CONSUMER_TOKEN" "https://api.github.com/user"
          probe CONSUMER_REPO "$CONSUMER_TOKEN" "https://api.github.com/repos/$REPO"
          probe CONSUMER_HOOKS "$CONSUMER_TOKEN" "https://api.github.com/repos/$REPO/hooks"
