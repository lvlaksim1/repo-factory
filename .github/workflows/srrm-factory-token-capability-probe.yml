name: SRRM Factory Token Capability Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/srrm-factory-token-capability-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test REPO_FACTORY_TOKEN on repo-factory itself
        env:
          TOKEN: ${{ secrets.REPO_FACTORY_TOKEN }}
          TARGET_REPO: "lvlaksim1/repo-factory"
          TARGET_RUN: "36832642578"
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TOKEN" ]]; then
            echo "TOKEN_PRESENT=0"
            exit 0
          fi
          echo "TOKEN_PRESENT=1"

          rerun_url="https://api.github.com/repos/$TARGET_REPO/actions/runs/$TARGET_RUN/rerun-failed-jobs"
          rcode="$(curl -sS -o /tmp/rerun -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{"action":"created","reaction":{"content":"eyes"}}' \
            "$rerun_url")"
          echo "RERUN_HTTP=$rcode"

          hook_payload='{"name":"web","active":false,"events":["reaction"],"config":{"url":"https://example.com/srrm-probe","content_type":"json","insecure_ssl":"0"}}'
          hcode="$(curl -sS -o /tmp/hook -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -X POST \
            --data-binary "$hook_payload" \
            "https://api.github.com/repos/$TARGET_REPO/hooks")"
          echo "HOOK_CREATE_HTTP=$hcode"

          if [[ "$hcode" == "201" ]]; then
            id="$(jq -r '.id' /tmp/hook)"
            dcode="$(curl -sS -o /tmp/del -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -X DELETE \
              "https://api.github.com/repos/$TARGET_REPO/hooks/$id")"
            echo "HOOK_DELETE_HTTP=$dcode"
          fi
