name: SRRM Hookshot Auth Scheme Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/srrm-hookshot-auth-scheme-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Compare auth schemes under Hookshot UA
        env:
          TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          body='{"event_type":"srrm_auth_probe","client_payload":{"source":"hookshot-auth-scheme"}}'
          base='https://api.github.com/repos/lvlaksim1/ai-agent-lab/dispatches'

          report() {
            name="$1"; shift
            code="$(curl -sS -o /tmp/body -w '%{http_code}' \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              -H "User-Agent: GitHub-Hookshot/test" \
              -X POST -d "$body" "$@")"
            echo "${name}_HTTP=$code"
            if [[ -s /tmp/body ]]; then
              title="$(grep -o '<title>[^<]*' /tmp/body | head -n1 | sed 's/<title>//' || true)"
              msg="$(jq -r '.message // empty' /tmp/body 2>/dev/null || true)"
              [[ -n "$title" ]] && echo "${name}_TITLE=$title"
              [[ -n "$msg" ]] && echo "${name}_MESSAGE=$msg" || true
            fi
            return 0
          }

          report BEARER -H "Authorization: Bearer $TOKEN" "$base"
          report TOKEN_SCHEME -H "Authorization: token $TOKEN" "$base"
          report BASIC_XACCESS -u "x-access-token:$TOKEN" "$base"
          report BASIC_LOGIN -u "lvlaksim1:$TOKEN" "$base"
          report URL_USERINFO "https://x-access-token:$TOKEN@api.github.com/repos/lvlaksim1/ai-agent-lab/dispatches"
