name: Remove Standard Secrets

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  remove-standard-secrets:
    if: github.event.issue.user.login == 'lvlaksim1' && github.event.issue.title == '[REMOVE_STANDARD_SECRETS]'
    runs-on: ubuntu-latest

    steps:
      - name: Validate request and remove secrets
        id: remove
        env:
          GH_TOKEN: \${{ secrets.REPO_FACTORY_TOKEN }}
          ISSUE_BODY: \${{ github.event.issue.body }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "\${GH_TOKEN:-}" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "message=REPO_FACTORY_TOKEN is not configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s' "$ISSUE_BODY" > request.json
          if ! jq -e . request.json >/dev/null 2>&1; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "message=Issue body must contain valid JSON" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NAME="$(jq -r '.name // empty' request.json)"
          if [[ ! "$NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "message=Invalid repository name" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TARGET_REPO="lvlaksim1/$NAME"
          if ! gh api "repos/$TARGET_REPO" >/dev/null 2>&1; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "message=Target repository is unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh secret delete TELEGRAM_BOT_TOKEN --repo "$TARGET_REPO" >/dev/null 2>&1 || true
          gh secret delete TELEGRAM_CHAT_ID --repo "$TARGET_REPO" >/dev/null 2>&1 || true

          echo "status=removed" >> "$GITHUB_OUTPUT"
          echo "target_repo=$TARGET_REPO" >> "$GITHUB_OUTPUT"

      - name: Report result
        env:
          GH_TOKEN: \${{ github.token }}
          ISSUE_NUMBER: \${{ github.event.issue.number }}
          STATUS: \${{ steps.remove.outputs.status }}
          MESSAGE: \${{ steps.remove.outputs.message }}
          TARGET_REPO: \${{ steps.remove.outputs.target_repo }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$STATUS" = "removed" ]; then
            BODY="REMOVED: $TARGET_REPO"$'\n'"SECRETS: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID"
          else
            BODY="FAILED: $MESSAGE"
          fi
          gh api --method POST \
            "repos/\${GITHUB_REPOSITORY}/issues/\${ISSUE_NUMBER}/comments" \
            -f body="$BODY"
