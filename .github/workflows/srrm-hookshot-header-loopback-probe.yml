name: SRRM Hookshot Header Loopback Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/srrm-hookshot-header-loopback-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Isolate GitHub Hookshot headers against repository_dispatch
        env:
          TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          url='https://api.github.com/repos/lvlaksim1/ai-agent-lab/dispatches'
          body='{"event_type":"srrm_header_probe","client_payload":{"source":"hookshot-header-probe"}}'

          call() {
            name="$1"; shift
            code="$(curl -sS -o /tmp/body -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              -X POST -d "$body" \
              "$@" "$url")"
            echo "${name}_HTTP=$code"
            if [[ -s /tmp/body ]]; then
              echo -n "${name}_BODY="
              tr '\n' ' ' </tmp/body | head -c 500
              echo
            fi
          }

          call BASELINE
          call EVENT_ONLY -H "X-GitHub-Event: reaction"
          call DELIVERY_ONLY -H "X-GitHub-Delivery: 11111111-2222-3333-4444-555555555555"
          call HOOKID_ONLY -H "X-GitHub-Hook-ID: 123456789"
          call UA_ONLY -H "User-Agent: GitHub-Hookshot/test"
          call ALL \
            -H "X-GitHub-Event: reaction" \
            -H "X-GitHub-Delivery: 11111111-2222-3333-4444-555555555555" \
            -H "X-GitHub-Hook-ID: 123456789" \
            -H "User-Agent: GitHub-Hookshot/test"
