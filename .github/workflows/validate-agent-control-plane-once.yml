name: Validate Agent Control Plane Once
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  validate:
    if: github.event.issue.user.login == 'lvlaksim1' && github.event.issue.title == '[VALIDATE_AGENT_CONTROL_PLANE_ONCE]'
    runs-on: ubuntu-latest
    steps:
      - name: Clone exact snapshot
        env:
          GH_TOKEN: ${{ secrets.REPO_FACTORY_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git >/dev/null
          gh repo clone lvlaksim1/agent-control-plane target >/dev/null
          git -C target checkout --detach e294de0bddc91557f226090f98f9461e6e2af856
          test "$(git -C target rev-parse HEAD)" = "e294de0bddc91557f226090f98f9461e6e2af856"
      - name: Validate contracts
        run: python3 target/tools/control_plane.py validate --root target
      - name: Run regression suite
        run: python3 -m unittest discover -s target/tests -v
      - name: Safety posture
        run: |
          python3 - <<'PY'
          import json, pathlib
          r=pathlib.Path("target")
          reg=json.loads((r/"registry/agents.json").read_text())
          assert all(a["automatic_execution_allowed"] is False for a in reg["agents"])
          lease=json.loads((r/"runtime/lease.json").read_text())
          assert lease["state"]=="idle"
          print("ACP_9_13_VALID")
          PY
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then MSG="ACP_9_13_VALIDATION_OK"; else MSG="ACP_9_13_VALIDATION_FAILED"; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="$MSG"
