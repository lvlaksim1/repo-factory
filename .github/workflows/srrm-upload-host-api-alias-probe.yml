name: SRRM Upload Host API Alias Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/srrm-upload-host-api-alias-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe non-asset API routes on uploads.github.com
        env:
          TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          raw='{"action":"created","reaction":{"content":"eyes"},"repository":{"full_name":"lvlaksim1/ai-agent-lab"}}'
          call() {
            name="$1"; url="$2"; body="$3"
            code="$(curl -sS -o /tmp/body -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              -H "User-Agent: GitHub-Hookshot/test" \
              -X POST --data-binary "$body" "$url")"
            echo "${name}_HTTP=$code"
            if [[ -s /tmp/body ]]; then
              echo -n "${name}_BODY="
              tr '\n' ' ' </tmp/body | head -c 700
              echo
            fi
          }
          call RERUN_INVALID 'https://uploads.github.com/repos/lvlaksim1/ai-agent-lab/actions/runs/999999999999/rerun-failed-jobs' "$raw"
          call DISPATCH_VALID 'https://uploads.github.com/repos/lvlaksim1/ai-agent-lab/dispatches' '{"event_type":"srrm_upload_alias_probe","client_payload":{"source":"uploads-host"}}'
          call PAGES_BUILD 'https://uploads.github.com/repos/lvlaksim1/ai-agent-lab/pages/builds' "$raw"
          call GRAPHQL 'https://uploads.github.com/graphql' '{"query":"query { viewer { login } }"}'
