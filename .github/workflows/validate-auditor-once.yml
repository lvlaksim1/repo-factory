name: Validate Auditor Once

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  validate:
    if: github.event.issue.user.login == 'lvlaksim1' && github.event.issue.title == '[VALIDATE_AUDITOR_ONCE]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.REPO_FACTORY_TOKEN }}
      CORE_COMMIT: 7aa1e697504e686b02a4d7f1539a157214d5e692
    steps:
      - name: Validate actual private Auditor
        shell: bash
        run: |
          set -euo pipefail
          WORK_DIR="$(mktemp -d)"
          trap 'rm -rf "$WORK_DIR"' EXIT

          gh auth setup-git >/dev/null
          gh repo clone lvlaksim1/project-manager-auditor "$WORK_DIR/auditor" -- --depth=1 >/dev/null
          git clone --quiet https://github.com/lvlaksim1/context-capsule.git "$WORK_DIR/context-capsule"
          git -C "$WORK_DIR/context-capsule" checkout --quiet --detach "$CORE_COMMIT"

          python "$WORK_DIR/context-capsule/installer/capsulectl.py" service-validate --target "$WORK_DIR/auditor"
          python "$WORK_DIR/context-capsule/installer/capsulectl.py" service-ready --target "$WORK_DIR/auditor"
          python "$WORK_DIR/context-capsule/installer/capsulectl.py" service-recover --target "$WORK_DIR/auditor" --max-chars 50000 > "$WORK_DIR/recovery.txt"

          grep -q "Agent ID: project-manager-auditor" "$WORK_DIR/recovery.txt"
          grep -q "Role: Auditor" "$WORK_DIR/recovery.txt"
          grep -q "## PROFILE STATE: .context/auditor/AUDIT_CONTRACT.md" "$WORK_DIR/recovery.txt"
          grep -q "## PROFILE STATE: .context/auditor/methodology.md" "$WORK_DIR/recovery.txt"
          grep -q "## PROFILE STATE: .context/auditor/independence.md" "$WORK_DIR/recovery.txt"
          grep -q "## PROFILE STATE: .context/auditor/probe-policy.md" "$WORK_DIR/recovery.txt"
          echo "Validated Auditor HEAD $(git -C "$WORK_DIR/auditor" rev-parse HEAD)"
