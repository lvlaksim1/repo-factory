name: Validate ACP Integration Once
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  validate:
    if: github.event.issue.user.login == 'lvlaksim1' && github.event.issue.title == '[VALIDATE_ACP_INTEGRATION_ONCE]'
    runs-on: ubuntu-latest
    steps:
      - name: Clone exact snapshot
        env:
          GH_TOKEN: ${{ secrets.REPO_FACTORY_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git >/dev/null
          gh repo clone lvlaksim1/agent-control-plane target >/dev/null
          git -C target checkout --detach 60bfb29b7a09333e3ce3219f99c4832fe188e50e
          test "$(git -C target rev-parse HEAD)" = "60bfb29b7a09333e3ce3219f99c4832fe188e50e"
      - name: Validate repository contracts
        run: python3 target/tools/control_plane.py validate --root target
      - name: Run regression suite
        run: python3 -m unittest discover -s target/tests -v
      - name: Verify routing and strict write contract
        run: |
          python3 - <<'PY'
          import json, pathlib
          r=pathlib.Path("target")
          routing=json.loads((r/"runtime/routing-policy.json").read_text())
          wc=json.loads((r/"runtime/dispatcher-write-contract.json").read_text())
          assert routing["human_entry_points"]["supervisor_is_mandatory_human_gateway"] is False
          assert routing["human_entry_points"]["direct_project_manager_development_chat"] is True
          assert wc["claim"]["required_fields"]==["execution_id","generation","slot_id","claimed_at"]
          assert "outcome" in wc["result"]["required_fields"]
          assert wc["result"]["fixed_values"]["outcome"]=="success"
          aud=json.loads((r/"tasks/TASK-INT-AUDITOR-002/request.json").read_text())
          assert aud["issuer_agent_id"]=="context-capsule-project-manager"
          assert aud["dependencies"]==[{"task_id":"TASK-INT-PM-002","relation":"depends_on"}]
          print("ACP_STRICT_INTEGRATION_VALID")
          PY
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then MSG="ACP_STRICT_INTEGRATION_VALIDATION_OK"; else MSG="ACP_STRICT_INTEGRATION_VALIDATION_FAILED"; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="$MSG"
