name: Remove Receiver Dispatch Secret

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  remove:
    if: github.event.issue.user.login == 'lvlaksim1' && github.event.issue.title == '[REMOVE_RECEIVER_DISPATCH_SECRET]'
    runs-on: ubuntu-latest

    steps:
      - name: Remove secret
        id: remove
        env:
          GH_TOKEN: ${{ secrets.REPO_FACTORY_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$ISSUE_BODY" > request.json
          jq -e . request.json >/dev/null

          NAME="$(jq -r '.name // empty' request.json)"
          if [[ ! "$NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid repository name" >&2
            exit 1
          fi

          TARGET_REPO="lvlaksim1/$NAME"
          gh api "repos/$TARGET_REPO" >/dev/null
          gh secret delete CONSUMER_DISPATCH_TOKEN --repo "$TARGET_REPO" >/dev/null 2>&1 || true

          echo "target_repo=$TARGET_REPO" >> "$GITHUB_OUTPUT"

      - name: Report result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TARGET_REPO: ${{ steps.remove.outputs.target_repo }}
        shell: bash
        run: |
          gh api --method POST             "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments"             -f body="REMOVED: $TARGET_REPO"$'\n'"SECRET: CONSUMER_DISPATCH_TOKEN"
