name: SRRM Projects Schema Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/srrm-projects-schema-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Project workflow GraphQL schema deeply
        env:
          TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ask() {
            label="$1"; q="$2"
            curl -sS -o "/tmp/$label.json" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -X POST --data-binary "$(jq -nc --arg q "$q" '{query:$q}')" \
              'https://api.github.com/graphql'
            echo "=== $label ==="
            jq -c '.data // .errors // .' "/tmp/$label.json"
          }
          ask WORKFLOW_TYPE 'query { __type(name:"ProjectV2Workflow") { name fields { name type { kind name ofType { kind name ofType { kind name } } } args { name type { kind name ofType { kind name } } defaultValue } } } }'
          ask CREATE_INPUT 'query { __type(name:"CreateProjectV2Input") { inputFields { name type { kind name ofType { kind name } } defaultValue } } }'
          ask COPY_INPUT 'query { __type(name:"CopyProjectV2Input") { inputFields { name type { kind name ofType { kind name } } defaultValue } } }'
          ask DELETE_WF_INPUT 'query { __type(name:"DeleteProjectV2WorkflowInput") { inputFields { name type { kind name ofType { kind name } } defaultValue } } }'
          ask PROJECT_TYPE 'query { __type(name:"ProjectV2") { fields { name type { kind name ofType { kind name } } args { name type { kind name ofType { kind name } } defaultValue } } } }'
