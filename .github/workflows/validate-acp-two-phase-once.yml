name: Validate ACP Two Phase Once
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  validate:
    if: github.event.issue.user.login == 'lvlaksim1' && github.event.issue.title == '[VALIDATE_ACP_TWO_PHASE_ONCE]'
    runs-on: ubuntu-latest
    steps:
      - name: Clone exact ACP snapshot
        env:
          GH_TOKEN: ${{ secrets.REPO_FACTORY_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git >/dev/null
          gh repo clone lvlaksim1/agent-control-plane target >/dev/null
          git -C target checkout --detach b9118d0c984f59e47713d14f42bd2967c444943b
          test "$(git -C target rev-parse HEAD)" = "b9118d0c984f59e47713d14f42bd2967c444943b"
      - name: Validate repository
        run: python3 target/tools/control_plane.py validate --root target
      - name: Run all regression tests
        run: python3 -m unittest discover -s target/tests -v
      - name: Verify two-phase contract surfaces
        run: |
          python3 - <<'PY'
          import json, pathlib
          r=pathlib.Path("target")
          wc=json.loads((r/"runtime/dispatcher-write-contract.json").read_text())
          assert wc["reservation"]["gateway_claim_result"]=="reserved"
          assert wc["reservation"]["target_writes_authorized"] is False
          assert wc["execution_admission"]["required_gateway_state"]=="active"
          assert wc["execution_admission"]["same_invocation_as_reservation"] is False
          doc=(r/"docs/SCHEDULED_CHAT_DISPATCHER.md").read_text()
          assert "reserved lease never authorizes" in doc.lower()
          assert "STOP THE DISPATCHER INVOCATION" in doc
          print("ACP_TWO_PHASE_VALID")
          PY
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then MSG="ACP_TWO_PHASE_VALIDATION_OK"; else MSG="ACP_TWO_PHASE_VALIDATION_FAILED"; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="$MSG"
