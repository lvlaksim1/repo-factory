name: Repository Factory

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  create-repository:
    if: github.event.issue.user.login == 'lvlaksim1' && github.event.issue.title == '[CREATE_REPOSITORY]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate and create repository
        id: create
        env:
          FACTORY_TOKEN: ${{ secrets.REPO_FACTORY_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${FACTORY_TOKEN:-}" ]; then
            echo "status=secret_missing" >> "$GITHUB_OUTPUT"
            echo "message=REPO_FACTORY_TOKEN is not configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s' "$ISSUE_BODY" > request.json

          if ! jq -e . request.json >/dev/null 2>&1; then
            echo "status=invalid" >> "$GITHUB_OUTPUT"
            echo "message=Issue body must contain valid JSON" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NAME="$(jq -r '.name // empty' request.json)"
          PRIVATE="$(jq -r 'if has("private") then .private else true end' request.json)"
          DESCRIPTION="$(jq -r '.description // ""' request.json)"
          PROFILE="$(jq -r '.profile // empty' request.json)"
          STANDARD_SECRETS="$(jq -r 'if has("standard_secrets") then .standard_secrets else true end' request.json)"
          AGENT_ID="$(jq -r '.agent_id // empty' request.json)"
          ROLE="$(jq -r '.role // empty' request.json)"
          SPECIALIZATION="$(jq -r '.specialization // empty' request.json)"

          if [[ ! "$NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "status=invalid" >> "$GITHUB_OUTPUT"
            echo "message=Invalid repository name" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$PRIVATE" != "true" && "$PRIVATE" != "false" ]]; then
            echo "status=invalid" >> "$GITHUB_OUTPUT"
            echo "message=Field private must be true or false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$PROFILE" != "project-manager" && "$PROFILE" != "service-agent" && "$PROFILE" != "infrastructure" ]]; then
            echo "status=invalid" >> "$GITHUB_OUTPUT"
            echo "message=Field profile is required and must be project-manager, service-agent or infrastructure" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$STANDARD_SECRETS" != "true" && "$STANDARD_SECRETS" != "false" ]]; then
            echo "status=invalid" >> "$GITHUB_OUTPUT"
            echo "message=Field standard_secrets must be true or false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$PROFILE" = "service-agent" ]]; then
            if [[ ! "$AGENT_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{2,127}$ ]]; then
              echo "status=invalid" >> "$GITHUB_OUTPUT"
              echo "message=service-agent profile requires a valid agent_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -z "$ROLE" ] || [ -z "$SPECIALIZATION" ]; then
              echo "status=invalid" >> "$GITHUB_OUTPUT"
              echo "message=service-agent profile requires non-empty role and specialization" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "standard_secrets=$STANDARD_SECRETS" >> "$GITHUB_OUTPUT"

          jq -n \
            --arg name "$NAME" \
            --arg description "$DESCRIPTION" \
            --argjson private "$PRIVATE" \
            '{name:$name, description:$description, private:$private, auto_init:true}' \
            > payload.json

          HTTP_CODE="$(curl -sS \
            -o response.json \
            -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer $FACTORY_TOKEN" \
            https://api.github.com/user/repos \
            -d @payload.json)"

          if [ "$HTTP_CODE" = "201" ]; then
            FULL_NAME="$(jq -r '.full_name' response.json)"
            HTML_URL="$(jq -r '.html_url' response.json)"
            echo "status=created" >> "$GITHUB_OUTPUT"
            echo "full_name=$FULL_NAME" >> "$GITHUB_OUTPUT"
            echo "html_url=$HTML_URL" >> "$GITHUB_OUTPUT"
          else
            ERROR_MESSAGE="$(jq -r '.message // "Unknown GitHub API error"' response.json 2>/dev/null || echo "Unknown GitHub API error")"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "message=HTTP $HTTP_CODE: $ERROR_MESSAGE" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Context Capsule profile
        id: capsule
        if: steps.create.outputs.status == 'created' && steps.create.outputs.profile != 'infrastructure'
        env:
          GH_TOKEN: ${{ secrets.REPO_FACTORY_TOKEN }}
          TARGET_REPO: ${{ steps.create.outputs.full_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        shell: bash
        run: |
          set -euo pipefail

          WORK_DIR="$(mktemp -d)"
          trap 'rm -rf "$WORK_DIR"' EXIT

          printf '%s' "$ISSUE_BODY" > "$WORK_DIR/request.json"
          PROFILE="$(jq -r '.profile' "$WORK_DIR/request.json")"

          LOCK_FILE="$GITHUB_WORKSPACE/components.lock.json"
          CONTEXT_CAPSULE_REPO="$(jq -r '.context_capsule_core.repository' "$LOCK_FILE")"
          CONTEXT_CAPSULE_COMMIT="$(jq -r '.context_capsule_core.commit' "$LOCK_FILE")"
          PROJECT_MANAGER_REPO="$(jq -r '.project_manager.repository' "$LOCK_FILE")"
          PROJECT_MANAGER_COMMIT="$(jq -r '.project_manager.commit' "$LOCK_FILE")"
          SERVICE_AGENT_BASE_REPO="$(jq -r '.service_agent_base.repository' "$LOCK_FILE")"
          SERVICE_AGENT_BASE_COMMIT="$(jq -r '.service_agent_base.commit' "$LOCK_FILE")"

          gh auth setup-git >/dev/null
          gh repo clone "$TARGET_REPO" "$WORK_DIR/target" -- --depth=1 >/dev/null

          TARGET_BRANCH="$(git -C "$WORK_DIR/target" branch --show-current)"

          if [ "$PROFILE" = "service-agent" ]; then
            SOURCE_COMMIT="$SERVICE_AGENT_BASE_COMMIT"
            git clone --quiet "https://github.com/$SERVICE_AGENT_BASE_REPO.git" "$WORK_DIR/service-agent-base"
            git -C "$WORK_DIR/service-agent-base" checkout --quiet --detach "$SOURCE_COMMIT"

            AGENT_ID="$(jq -r '.agent_id' "$WORK_DIR/request.json")"
            ROLE="$(jq -r '.role' "$WORK_DIR/request.json")"
            SPECIALIZATION="$(jq -r '.specialization' "$WORK_DIR/request.json")"

            python "$WORK_DIR/service-agent-base/installer/servicectl.py" install \
              --target "$WORK_DIR/target" \
              --repository "$TARGET_REPO" \
              --branch "$TARGET_BRANCH" \
              --agent-id "$AGENT_ID" \
              --role "$ROLE" \
              --specialization "$SPECIALIZATION" \
              --source-commit "$SOURCE_COMMIT"
            COMMIT_MESSAGE="Install Service Agent Base"
          else
            SOURCE_COMMIT="$PROJECT_MANAGER_COMMIT"
            git clone --quiet "https://github.com/$PROJECT_MANAGER_REPO.git" "$WORK_DIR/project-manager"
            git -C "$WORK_DIR/project-manager" checkout --quiet --detach "$SOURCE_COMMIT"

            python "$WORK_DIR/project-manager/installer/pmctl.py" install \
              --target "$WORK_DIR/target" \
              --repository "$TARGET_REPO" \
              --branch "$TARGET_BRANCH" \
              --project-manager-commit "$SOURCE_COMMIT" \
              --context-capsule-commit "$CONTEXT_CAPSULE_COMMIT"
            COMMIT_MESSAGE="Install Project Manager v2"
          fi

          git -C "$WORK_DIR/target" config user.name "repo-factory"
          git -C "$WORK_DIR/target" config user.email "repo-factory@users.noreply.github.com"
          git -C "$WORK_DIR/target" add -A
          git -C "$WORK_DIR/target" commit --quiet -m "$COMMIT_MESSAGE"
          git -C "$WORK_DIR/target" push --quiet origin "HEAD:$TARGET_BRANCH"

      - name: Copy standard Telegram secrets
        id: secrets
        if: steps.create.outputs.status == 'created' && steps.create.outputs.standard_secrets == 'true'
        env:
          GH_TOKEN: ${{ secrets.REPO_FACTORY_TOKEN }}
          TARGET_REPO: ${{ steps.create.outputs.full_name }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "status=not_configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! gh secret set TELEGRAM_BOT_TOKEN --repo "$TARGET_REPO" --body "$TELEGRAM_BOT_TOKEN"; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! gh secret set TELEGRAM_CHAT_ID --repo "$TARGET_REPO" --body "$TELEGRAM_CHAT_ID"; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "status=synced" >> "$GITHUB_OUTPUT"

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STATUS: ${{ steps.create.outputs.status }}
          MESSAGE: ${{ steps.create.outputs.message }}
          FULL_NAME: ${{ steps.create.outputs.full_name }}
          HTML_URL: ${{ steps.create.outputs.html_url }}
          PROFILE: ${{ steps.create.outputs.profile }}
          STANDARD_SECRETS: ${{ steps.create.outputs.standard_secrets }}
          CAPSULE_OUTCOME: ${{ steps.capsule.outcome }}
          SECRETS_STATUS: ${{ steps.secrets.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail

          case "$STATUS" in
            created)
              BODY="CREATED: $FULL_NAME"$'\n'"$HTML_URL"
              BODY="$BODY"$'\n'"CONTEXT_CAPSULE_PROFILE: $PROFILE"
              if [ "$PROFILE" = "infrastructure" ]; then
                BODY="$BODY"$'\n'"CONTEXT_CAPSULE: NOT_APPLICABLE"
              elif [ "$CAPSULE_OUTCOME" = "success" ]; then
                BODY="$BODY"$'\n'"CONTEXT_CAPSULE: INSTALLED"
              else
                BODY="$BODY"$'\n'"CONTEXT_CAPSULE: FAILED"
              fi

              if [ "$STANDARD_SECRETS" = "false" ]; then
                BODY="$BODY"$'\n'"STANDARD_SECRETS: SKIPPED_BY_REQUEST"
              else
                case "$SECRETS_STATUS" in
                  synced)
                    BODY="$BODY"$'\n'"STANDARD_SECRETS: SYNCED"
                    ;;
                  not_configured)
                    BODY="$BODY"$'\n'"STANDARD_SECRETS: NOT_CONFIGURED_IN_FACTORY"
                    ;;
                  failed)
                    BODY="$BODY"$'\n'"STANDARD_SECRETS: SYNC_FAILED"
                    ;;
                  *)
                    BODY="$BODY"$'\n'"STANDARD_SECRETS: UNKNOWN"
                    ;;
                esac
              fi
              ;;
            secret_missing)
              BODY="FAILED: REPO_FACTORY_TOKEN is not configured."
              ;;
            invalid)
              BODY="FAILED: $MESSAGE"
              ;;
            *)
              BODY="FAILED: $MESSAGE"
              ;;
          esac

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="$BODY"
