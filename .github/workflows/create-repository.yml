name: Repository Factory

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  create-repository:
    if: github.event.issue.user.login == 'lvlaksim1' && github.event.issue.title == '[CREATE_REPOSITORY]'
    runs-on: ubuntu-latest

    steps:
      - name: Validate and create repository
        id: create
        env:
          FACTORY_TOKEN: ${{ secrets.REPO_FACTORY_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${FACTORY_TOKEN:-}" ]; then
            echo "status=secret_missing" >> "$GITHUB_OUTPUT"
            echo "message=REPO_FACTORY_TOKEN is not configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s' "$ISSUE_BODY" > request.json

          if ! jq -e . request.json >/dev/null 2>&1; then
            echo "status=invalid" >> "$GITHUB_OUTPUT"
            echo "message=Issue body must contain valid JSON" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NAME="$(jq -r '.name // empty' request.json)"
          PRIVATE="$(jq -r 'if has("private") then .private else true end' request.json)"
          DESCRIPTION="$(jq -r '.description // ""' request.json)"

          if [[ ! "$NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "status=invalid" >> "$GITHUB_OUTPUT"
            echo "message=Invalid repository name" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$PRIVATE" != "true" && "$PRIVATE" != "false" ]]; then
            echo "status=invalid" >> "$GITHUB_OUTPUT"
            echo "message=Field private must be true or false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          jq -n             --arg name "$NAME"             --arg description "$DESCRIPTION"             --argjson private "$PRIVATE"             '{name:$name, description:$description, private:$private, auto_init:true}'             > payload.json

          HTTP_CODE="$(curl -sS             -o response.json             -w '%{http_code}'             -X POST             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             -H "Authorization: Bearer $FACTORY_TOKEN"             https://api.github.com/user/repos             -d @payload.json)"

          if [ "$HTTP_CODE" = "201" ]; then
            FULL_NAME="$(jq -r '.full_name' response.json)"
            HTML_URL="$(jq -r '.html_url' response.json)"
            echo "status=created" >> "$GITHUB_OUTPUT"
            echo "full_name=$FULL_NAME" >> "$GITHUB_OUTPUT"
            echo "html_url=$HTML_URL" >> "$GITHUB_OUTPUT"
          else
            ERROR_MESSAGE="$(jq -r '.message // "Unknown GitHub API error"' response.json 2>/dev/null || echo "Unknown GitHub API error")"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "message=HTTP $HTTP_CODE: $ERROR_MESSAGE" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy standard Telegram secrets
        id: secrets
        if: steps.create.outputs.status == 'created'
        env:
          GH_TOKEN: ${{ secrets.REPO_FACTORY_TOKEN }}
          TARGET_REPO: ${{ steps.create.outputs.full_name }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "status=not_configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! gh secret set TELEGRAM_BOT_TOKEN --repo "$TARGET_REPO" --body "$TELEGRAM_BOT_TOKEN"; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! gh secret set TELEGRAM_CHAT_ID --repo "$TARGET_REPO" --body "$TELEGRAM_CHAT_ID"; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "status=synced" >> "$GITHUB_OUTPUT"

      - name: Report result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STATUS: ${{ steps.create.outputs.status }}
          MESSAGE: ${{ steps.create.outputs.message }}
          FULL_NAME: ${{ steps.create.outputs.full_name }}
          HTML_URL: ${{ steps.create.outputs.html_url }}
          SECRETS_STATUS: ${{ steps.secrets.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail

          case "$STATUS" in
            created)
              BODY="CREATED: $FULL_NAME"$'\n'"$HTML_URL"
              case "$SECRETS_STATUS" in
                synced)
                  BODY="$BODY"$'\n'"STANDARD_SECRETS: SYNCED"
                  ;;
                not_configured)
                  BODY="$BODY"$'\n'"STANDARD_SECRETS: NOT_CONFIGURED_IN_FACTORY"
                  ;;
                failed)
                  BODY="$BODY"$'\n'"STANDARD_SECRETS: SYNC_FAILED"
                  ;;
              esac
              ;;
            secret_missing)
              BODY="FAILED: REPO_FACTORY_TOKEN is not configured."
              ;;
            invalid)
              BODY="FAILED: $MESSAGE"
              ;;
            *)
              BODY="FAILED: $MESSAGE"
              ;;
          esac

          gh api             --method POST             "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments"             -f body="$BODY"
