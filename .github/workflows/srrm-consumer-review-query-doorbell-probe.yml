name: SRRM Consumer Review Query Doorbell Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/srrm-consumer-review-query-doorbell-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test PR review event/body via query with raw reaction payload
        env:
          TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          raw='{"action":"created","reaction":{"content":"heart"},"repository":{"full_name":"lvlaksim1/ai-agent-lab"},"sender":{"login":"lvlaksim1"}}'
          url='https://api.github.com/repos/lvlaksim1/ai-agent-lab/pulls/1/reviews?event=COMMENT&body=SRRM_QUERY_REVIEW_DOORBELL'
          code="$(curl -sS -o /tmp/body -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -X POST \
            --data-binary "$raw" \
            "$url")"
          echo "REVIEW_HTTP=$code"
          jq -c '{id,state,body,user:.user.login,message,errors}' /tmp/body 2>/dev/null || cat /tmp/body
